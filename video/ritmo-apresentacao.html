<!doctype html>
<html lang="pt-BR">
<head>

<title>Ritmo.: filme de apresentação</title>
<!--
  Filme de apresentação da Ritmo (84s), em 16:9 e 9:16.

  Um plano contínuo conduzido pela bola sólida da marca, que faz o papel da
  batida: quica de palavra em palavra e preenche o lettering, sincroniza as
  pistas, vira a marca, percorre o método e fecha cada frase como ponto final.
  Textos tirados do documento de identidade intelectual da Ritmo; a cena dos
  sócios usa src/data/team.ts.

    0  Abertura     "Cada empresa tem uma cadência."
    1  Pistas       pessoas, processos e tecnologia, cada uma no seu tempo,
                    com os atritos do documento; "Conhecer uma ferramenta é o
                    começo." / "Seu valor depende de adequação, adoção e
                    continuidade."
    2  Sincronia    uma agulha alinha as pistas, elas convergem e o ponto vira
                    a marca; "Tradução, escolha e adoção." / "É nesse espaço
                    que a Ritmo atua."
    3  Método       um percurso com as cinco etapas, cada uma com a sua saída
    4  Escala       aproveitar, configurar, conectar, desenvolver
    5  Sócios       quatro sócios, quatro frentes
    6  Compromisso  "Critério para decidir. Cuidado para implantar." e os
                    seis compromissos numa frase só, preenchida pela bola
    7  Fecho        "Entender a rotina. Escolher com critério. Fazer
                    funcionar."; a marca sobre o quadro de Monet, que abre a
                    partir da bola; "Fale conosco" e o telefone

  Motor igual ao dos vídeos da Level: render(t) determinístico, chamado quadro
  a quadro por render.mjs; window.CUES e CHORDS alimentam score.mjs.
-->

  @font-face { font-family: "Manrope"; src: url("fonts/manrope-latin-ext-wght-normal.woff2") format("woff2"); font-weight: 200 800;

<body>
<div id="stage">

<script>
// ---------------------------------------------------------------------------
// Conteúdo (documento de identidade da Ritmo; sócios de src/data/team.ts)
// ---------------------------------------------------------------------------
const STEPS = [
  ["Entender", "Problema com evidências."],
  ["Priorizar", "Objetivo, responsável e medida inicial."],
  ["Escolher", "Recomendação, custos e limites."],
  ["Adotar", "Entrega testada e pessoas orientadas."],
  ["Acompanhar", "Decisão de manter, corrigir ou ampliar."],
];
const LEVELS = [["Aproveitar", "O que já funciona"], ["Configurar", "Solução existente"], ["Conectar", "Ferramentas e dados"], ["Desenvolver", "Lacuna real"]];
const TEAM = [
  ["Design", "Armando Custodio", "armando-custodio"],
  ["Engenharia", "Vitor Ribeiro", "vitor-ribeiro"],
  ["Direito", "João Pedro Carneiro", "joao-pedro-carneiro"],
  ["Gestão", "Diogo Siqueira", "diogo-siqueira"],
];
// Os seis compromissos do documento, numa frase só (linhas por formato).
const COMMIT_LINES = {
  h: [["Clareza,", "evidência,", "proporção,"], ["autonomia,", "transparência"], ["e continuidade"]],
  v: [["Clareza,", "evidência,"], ["proporção,", "autonomia,"], ["transparência"], ["e continuidade"]],
};
const CLOSE = ["Entender a rotina", "Escolher com critério", "Fazer funcionar"];

// ---------------------------------------------------------------------------
// Linha do tempo (segundos)
// ---------------------------------------------------------------------------
const T = { s0: [0, 7], s1: [7, 16.5], s2: [16.5, 27], s3: [27, 47], s4: [47, 54.6], s5: [54.6, 62], s6: [62, 71.6], s7: [71.6, 84.4] };
const DURATION = 84.4;
const S0 = { pulse: [0.4, 1.0, 1.6], land0: 2.1, hop: 0.48, period: 4.75 };
const S1 = { lanes: 7.2, badges: [8.6, 9.3, 10.0], a: [8.0, 11.8], b: [12.0, 16.2], hl: [13.5, 14.0, 14.5] };
const S2 = { sweep: [16.6, 18.2], conv: [18.2, 19.6], center: [19.8, 20.6], mark: 20.4, word: 21.0, dot: 21.7, up: [22.4, 23.0], a: 22.9, hl: [23.1, 23.5, 23.9], b: 23.4, iris: [26.3, 27] };
const ST0 = 30.0, STD = 3.2, TRAVEL = 1.15;      // método: chegada em cada etapa
const S3 = { title: [27.3, 29.6], zoom: [45.0, 46.4] };
const S4 = { title: 47.4, bars: 48.0, hop0: 49.3, hop: 0.55, note: 50.6, wipe: [53.9, 54.6] };
const S5 = { a: 55.0, b: 55.5, p0: 56.2, p: 0.55, merge: [61.4, 62.0] };
const S6 = { lead: 62.3, text: 63.4, land0: 64.4, hop: 0.62 };   // a bola preenche a frase palavra a palavra
const S7 = { l0: 72.0, l: 0.9, out: [76.0, 76.6], mark: 76.7, paint: [77.0, 78.6], word: 77.7, dot: 78.3, line: 78.9, cta: 79.5, url: 79.9 };

// Notas da trilha: pentatônica, sobe conforme a bola avança.
const NOTES = [293.66, 329.63, 392, 440, 523.25, 587.33, 659.25];
const pl = (t, i, g = 1) => ({ t, type: "pluck", soft: true, f: NOTES[i % NOTES.length], g });
const CUES = [
  ...S0.pulse.map(t => pl(t, 0, 0.7)),
  ...[0, 1, 2, 3, 4].map(i => pl(S0.land0 + i * S0.hop, i)),
  pl(S0.period, 5, 1.1),
  { t: T.s1[0] - 0.3, type: "bloom", f: 392 },
  ...S1.badges.map(t => pl(t, 1, 0.6)),
  ...S1.hl.map((t, i) => pl(t, 2 + i, 0.8)),
  { t: S2.sweep[0], type: "bloom", f: 523.25 },
  { t: S2.conv[0], type: "bloom", f: 440 },
  { t: S2.mark + 0.9, type: "thump" },
  pl(S2.dot, 5, 1.1),
  ...S2.hl.map((t, i) => pl(t, 2 + i, 0.8)),
  { t: S2.iris[0], type: "bloom", f: 587.33 },
  { t: S2.iris[1] - 0.1, type: "thump", g: 0.8 },
  ...STEPS.map((_, i) => pl(ST0 + i * STD, i)),
  { t: S3.zoom[0], type: "bloom", f: 392 },
  ...LEVELS.map((_, i) => pl(S4.hop0 + i * S4.hop, i + 1)),
  { t: S4.wipe[0], type: "bloom", f: 523.25 },
  { t: S4.wipe[1] - 0.1, type: "thump", g: 0.8 },
  ...TEAM.map((_, i) => pl(S5.p0 + i * S5.p, i, 0.8)),
  ...[0, 1, 2, 3, 4, 5].map(i => pl(S6.land0 + i * S6.hop, i)),
  pl(S6.land0 + 6 * S6.hop + 0.1, 5, 1.1),
  ...CLOSE.map((_, i) => pl(S7.l0 + i * S7.l + 0.2, 2 + i)),
  { t: S7.mark + 0.9, type: "thump" },
  pl(S7.dot, 5, 1.1),
];
// Pad sóbrio, trocando devagar.
const CHORDS = [
  [0, 9, [110, 164.81, 220, 261.63, 329.63]],
  [9, 16.5, [87.31, 130.81, 174.61, 220, 261.63]],
  [16.5, 27, [130.81, 196, 261.63, 329.63, 392]],
  [27, 37, [98, 146.83, 196, 246.94, 293.66]],
  [37, 47, [110, 164.81, 220, 261.63, 329.63]],
  [47, 54.6, [87.31, 130.81, 174.61, 220, 261.63]],
  [54.6, 62, [130.81, 196, 261.63, 329.63]],
  [62, 71.6, [98, 146.83, 196, 246.94, 293.66]],
  [71.6, 84.4, [130.81, 196, 246.94, 293.66, 329.63]],
];

// ---------------------------------------------------------------------------
// Utilitários
// ---------------------------------------------------------------------------
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const p = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const outCubic = k => 1 - Math.pow(1 - k, 3);
const outQuart = k => 1 - Math.pow(1 - k, 4);
const inCubic = k => k * k * k;
const inOutCubic = k => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
const inOutQuint = k => (k < 0.5 ? 16 * k ** 5 : 1 - Math.pow(-2 * k + 2, 5) / 2);
const outBack = (k, s = 1.6) => 1 + (s + 1) * Math.pow(k - 1, 3) + s * Math.pow(k - 1, 2);
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

let W = 1920, H = 1080, U = 10.8, V = false;
let M = {};       // medidas de layout (feitas depois das fontes)
let GRAIN = [];

function wrapLetters(text) { return [...text].map(c => `<span class="l">${c === " " ? "&nbsp;" : c}</span>`).join(""); }
function splitWords(el) {
  const hl = (el.dataset.hl || "").split("|").filter(Boolean);
  el.innerHTML = el.dataset.t.split(" ").map(w => hl.includes(w) ? `<span class="w hl"><b></b>${wrapLetters(w)}</span>` : `<span class="w">${wrapLetters(w)}</span>`).join(" ");
}
function letters(el, text) {
  el.innerHTML = [...text].map(c => `<span class="m"><span>${c}</span></span>`).join("") + `<span class="dotslot"></span>`;
}
// Lettering vivo: cada letra entra com um pequeno salto (sobe, gira e cresce
// com sobra) e sai caindo de leve, em onda ao longo da frase.
function words(el, t, tin, tout, { stagger = 0.05, dur = 0.85 } = {}) {
  const ws = el.querySelectorAll(":scope > .w");
  const N = el.querySelectorAll(".l").length || 1;
  let n = 0;
  ws.forEach((w, i) => {
    w.style.opacity = 1; w.style.filter = "none"; w.style.transform = "none";
    let wo = 0;
    w.querySelectorAll(":scope > .l").forEach((l, j) => {
      const a = tin + i * stagger + j * 0.022;
      const k = p(t, a, a + dur * 0.75), kb = outBack(k, 1.9);
      const ka = tout === undefined ? Infinity : tout - 0.6 + 0.2 * n / N;
      const ko = inCubic(p(t, ka, ka + 0.35));
      const sg = n % 2 ? 1 : -1;
      l.style.opacity = clamp(k * 2.2) * (1 - ko);
      l.style.transform = k >= 1 && ko <= 0 ? "none" :
        `translateY(${((1 - kb) * 0.7 + ko * 0.4).toFixed(3)}em) rotate(${((1 - kb) * 14 * sg + ko * 10 * sg).toFixed(2)}deg) scale(${(0.6 + 0.4 * kb).toFixed(3)})`;
      l.dataset.ok = k >= 1 && ko <= 0 ? "1" : "0";
      wo = Math.max(wo, +l.style.opacity);
      n++;
    });
    // a tarja de destaque (palavras .hl) acompanha a visibilidade das letras
    const box = w.querySelector(":scope > b");
    if (box) box.style.opacity = wo;
  });
}
// Quando a bola pousa numa palavra, as letras fazem uma onda a partir do centro.
function ripple(w, t, tl, amp = 0.14) {
  const ls = w.querySelectorAll(".l"), mid = (ls.length - 1) / 2;
  ls.forEach((l, j) => {
    const k = p(t, tl + Math.abs(j - mid) * 0.03, tl + Math.abs(j - mid) * 0.03 + 0.32);
    l.style.transform = k > 0 && k < 1 ? `translateY(${(-Math.sin(Math.PI * k) * amp).toFixed(3)}em)` : "none";
  });
}
// Palavra amassa um instante sob o peso da bola.
const press = (t, tl) => Math.sin(Math.PI * p(t, tl, tl + 0.2));
function fade(el, t, tin, tout, dist = 1.5, dur = 0.8) {
  const k = outCubic(p(t, tin, tin + dur));
  const ko = tout === undefined ? 0 : inCubic(p(t, tout - 0.5, tout));
  el.style.opacity = k * (1 - ko);
  el.style.translate = `0 ${((1 - k) * dist - ko * dist * 0.6) * U}px`;
  const b = (1 - k) * 8 + ko * 6;
  el.style.filter = b > 0.05 ? `blur(${b.toFixed(2)}px)` : "none";
}
// Letras sobem de uma máscara; saem para cima em tout.
function rise(el, t, tin, tout, stagger = 0.06) {
  $$(".m > span", el).forEach((l, i) => {
    const k = outQuart(p(t, tin + i * stagger, tin + i * stagger + 0.6));
    const ko = tout === undefined ? 0 : inCubic(p(t, tout - 0.35 + i * 0.015, tout + i * 0.015));
    l.style.transform = `translateY(${((1 - k) * 110 - ko * 110).toFixed(2)}%)`;
  });
}
function show(el, [a, b]) {
  const on = __t >= a - 0.001 && __t < b;
  el.style.display = on ? "" : "none";
  return on;
}
// Contorno -> preenchimento (o mesmo truque da hero do site).
function outline(el, k, rgb = "255,255,255", sw = 0.022) {
  el.style.color = `rgba(${rgb},${k.toFixed(3)})`;
  el.style.webkitTextStroke = `${(1 - k) * sw}em rgb(${rgb})`;
}
// Marca: anel desenhado; a bola sólida é a bola global (fx).
function markRing(svg, t, t0) {
  const ring = $(".ring", svg), C = 2 * Math.PI * 10;
  ring.setAttribute("stroke-dasharray", C);
  ring.setAttribute("stroke-dashoffset", C * (1 - outCubic(p(t, t0, t0 + 0.9))));
}
// O ponto de "Ritmo." cai do alto e quica no lugar.
function dropDot(word, t, td, op) {
  const slot = $(".dotslot", word);
  if (!slot.firstChild) { slot.innerHTML = `<span style="display:inline-block">.</span>`; slot.style.width = "auto"; }
  const d = slot.firstChild, k = p(t, td - 0.35, td);
  const y = t < td ? -(1 - inCubic(k)) * 1.6 : -Math.abs(Math.sin((t - td) * 9)) * 0.18 * Math.exp(-(t - td) * 6);
  d.style.transform = `translateY(${y.toFixed(3)}em)`;
  d.style.opacity = (t >= td - 0.35 ? 1 : 0) * op;
}
// Arco de pulo entre dois pontos.
function hop(a, b, k, h) {
  return [lerp(a[0], b[0], k), lerp(a[1], b[1], k) - h * 4 * k * (1 - k)];
}
function rectOf(el) { const r = el.getBoundingClientRect(); return { x: r.left, y: r.top, w: r.width, h: r.height, cx: r.left + r.width / 2, cy: r.top + r.height / 2, b: r.bottom, r: r.right }; }

function layout(w, h) {
  W = w; H = h; V = h > w;
  U = V ? w / 100 : h / 100;
  document.documentElement.style.setProperty("--u", U + "px");
  document.body.classList.toggle("v", V);
  $("#stage").style.width = W + "px";
  $("#stage").style.height = H + "px";
  $("#fx").setAttribute("width", W); $("#fx").setAttribute("height", H);
}

function buildGrain() {
  for (let n = 0; n < 8; n++) {
    const c = document.createElement("canvas");
    c.width = c.height = 256;
    const g = c.getContext("2d"), img = g.createImageData(256, 256);
    let seed = 1234 + n * 977;
    const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
    for (let i = 0; i < img.data.length; i += 4) {
      const v = rnd() * 255;
      img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
      img.data[i + 3] = 255;
    }
    g.putImageData(img, 0, 0);
    GRAIN.push(c.toDataURL());
  }
}

// Geometria por formato.
const G = {};
function geometry() {
  // 0 Abertura
  G.s0fs = V ? U * 13 : U * 10;
  G.s0lines = V ? [["Cada", "empresa"], ["tem", "uma"], ["cadência"]] : [["Cada", "empresa", "tem"], ["uma", "cadência"]];
  // 1 Pistas
  G.x0 = V ? U * 8 : W * 0.2; G.x1 = V ? W - U * 8 : W * 0.7;
  G.ys = V ? [H * 0.2, H * 0.29, H * 0.38] : [H * 0.25, H * 0.38, H * 0.51];
  G.capY = V ? H * 0.52 : H * 0.69;
  G.capFs = V ? U * 6.4 : U * 4.6;
  G.P = V ? [W * 0.5, H * 0.47] : [W * 0.84, H * 0.38];
  // 2 Marca
  G.mark = V ? U * 30 : U * 17;
  G.wordFs = V ? U * 15 : U * 10;
  // 3 Método: estações no mundo
  G.stations = STEPS.map((_, i) => V ? [U * 9 + (i % 2 ? U * 4 : 0), i * U * 62] : [i * U * 70, (i % 2 ? -1 : 1) * U * 4]);
  // 4 Escala
  G.bw = V ? U * 19 : U * 20; G.bgap = V ? U * 3 : U * 3.4;
  G.bh = V ? [U * 12, U * 22, U * 32, U * 42] : [U * 9, U * 16, U * 23, U * 30];
  G.base = V ? H * 0.66 : H * 0.72;
  // 5 Sócios
  G.pr = V ? U * 15 : U * 11;
  G.pc = V ? [[W * 0.29, H * 0.43], [W * 0.71, H * 0.43], [W * 0.29, H * 0.72], [W * 0.71, H * 0.72]]
           : [0.2, 0.4, 0.6, 0.8].map(x => [W * x, H * 0.55]);
  // 6 Compromisso
  G.s6fs = V ? U * 10 : U * 7.6;
  G.s6lines = V ? COMMIT_LINES.v : COMMIT_LINES.h;
  // posição de cada compromisso no par: colunas no 16:9, linhas no 9:16
  G.cwY = V ? H * 0.42 : H * 0.42;
}

  // 4

  // 7
  $("#s7-lines").innerHTML = CLOSE.map(l => `<div>${[...l].map(c => `<span class="m" style="display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.08em;margin-bottom:-.08em"><span style="display:inline-block">${c === " " ? "&nbsp;" : c}</span></span>`).join("")}<span class="dotslot"></span></div>`).join("");
  letters($("#s7-word"), "Ritmo");

// Ilustrações do método, em unidades locais (viewBox 40x24).
const ILL = [];
function buildIllustrations() {
  const S = `fill="none" stroke="#14171e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"`;
  const svgs = $$("#stations .ill");
  // 1 Entender: rotina (fila de pontos) e uma lupa que encontra o problema
  svgs[0].innerHTML = [...Array(7)].map((_, i) => `<circle class="d" cx="${4 + i * 5.3}" cy="16" r="1.2" fill="#14171e"/>`).join("") +
    `<g class="lens"><circle cx="0" cy="0" r="4.2" ${S}/><path d="M3 3 L6.5 6.5" ${S} stroke-width="1.4"/></g>`;

  svgs[1].innerHTML = [0, 1, 2].map(i => `<g class="row"><circle cx="5" cy="0" r="1.9" ${S}/><path d="M10 0 H ${[22, 34, 16][i]}" ${S} stroke-width="1.6"/></g>`).join("");
  // 3 Escolher: três opções, a do meio vem para a frente e ganha o check

  // 4 Adotar: duas peças se encaixam e viram uma só
  svgs[3].innerHTML = `<g class="pa"><path d="M0 4 H9 V9 A2.4 2.4 0 0 1 9 15 V20 H0 Z" fill="#f3f2ee" ${S.replace('fill="none" ', '')}/></g>` +
    `<g class="pb"><path d="M0 4 H11 V20 H0 V15 A2.4 2.4 0 0 0 0 9 Z" fill="#f3f2ee" ${S.replace('fill="none" ', '')}/></g>`;
  // 5 Acompanhar: um painel com o uso medido (barras), a tendência e o selo

  const bx = [8, 13.5, 19, 24.5], bh = [5, 8.5, 6.5, 11];
  const cx = 32.5, cy = 4.5, r = 2.3, a0 = -2.4, a1 = a0 + 4.9;
  const P0 = [cx + r * Math.cos(a0), cy + r * Math.sin(a0)], P1 = [cx + r * Math.cos(a1), cy + r * Math.sin(a1)];
  const dir = [-Math.sin(a1), Math.cos(a1)], nrm = [Math.cos(a1), Math.sin(a1)];
  const tip = [P1[0] + dir[0] * 1.2, P1[1] + dir[1] * 1.2];
  const b1 = [P1[0] + nrm[0] * 0.9, P1[1] + nrm[1] * 0.9], b2 = [P1[0] - nrm[0] * 0.9, P1[1] - nrm[1] * 0.9];
  const f = v => v.toFixed(2);
  svgs[4].innerHTML = `<rect x="3" y="2" width="28" height="21" rx="2.4" ${S}/>` +

    `<path class="trend" d="M${bx.map((x, j) => `${x} ${19.5 - bh[j] - 2.2}`).join(" L ")}" ${S} stroke-width="0.9"/>` +
    `<g class="badge"><circle cx="${cx}" cy="${cy}" r="4.6" fill="#14171e"/>` +

    `<path d="M${f(b1[0])} ${f(b1[1])} L ${f(tip[0])} ${f(tip[1])} L ${f(b2[0])} ${f(b2[1])} Z" fill="#f3f2ee"/></g>`;
}

// Medidas que dependem das fontes.

  // 0: posição de cada palavra e do ponto final

  const ds = rectOf($("#s0-text .dotslot"));
  const last = M.s0[M.s0.length - 1];

// ---------------------------------------------------------------------------
// render(t)
// ---------------------------------------------------------------------------
let __t = 0;
const ball = { x: 0, y: 0, r: 0, sy: 1, color: "#fff", on: false };
const BH = [];   // histórico da bola nos últimos quadros (rastro e velocidade)
function setBall(x, y, r, sy = 1, color = "#fff") { Object.assign(ball, { x, y, r, sy, color, on: true }); }

function render(t) {
  __t = t;
  ball.on = false;
  const paper = t >= S2.iris[1] && t < S4.wipe[1];
  $("#stage").style.background = paper ? "var(--paper)" : "var(--navy)";
  $("#grid").style.opacity = paper ? 0 : 1;
  $("#grid").style.transform = `translate(${-t * U * 0.3}px, ${-t * U * 0.45}px)`;
  $("#vignette").style.opacity = paper ? 0.1 : 1;
  $("#wipe").style.display = "none";

  r0(t); r1(t); r2(t); r3(t); r4(t); r5(t); r6(t); r7(t);

  // Vida da bola: estica na direção do movimento, deixa rastro quando corre,
  // respira quando para. A velocidade vem do quadro anterior (render.mjs chama
  // render(t) em ordem); fora de sequência, a bola fica sem rastro.
  const b = $("#ball"), trails = $$("#fx .trail");
  const seq = BH.length && Math.abs(t - BH[0].t - 1 / 30) < 1e-3;
  if (!seq) BH.length = 0;
  const small = ball.r < U * 4;
  let vx = 0, vy = 0;
  if (ball.on && seq && BH[0].on) { vx = (ball.x - BH[0].x) * 30; vy = (ball.y - BH[0].y) * 30; }
  const speed = Math.hypot(vx, vy);
  if (ball.on && ball.r > 0.01) {
    const st = small ? clamp(speed / (U * 150), 0, 0.36) : 0;
    const ang = Math.atan2(vy, vx) * 180 / Math.PI;
    const breathe = small && speed < U * 3 ? 1 + 0.035 * Math.sin(t * 5.2) : 1;
    const r = ball.r * breathe;
    b.setAttribute("cx", ball.x); b.setAttribute("cy", ball.y);
    b.setAttribute("r", r); b.setAttribute("fill", ball.color);
    b.setAttribute("transform", `translate(${ball.x} ${ball.y + r * (1 - ball.sy)}) rotate(${ang.toFixed(2)}) scale(${(1 + st).toFixed(3)} ${(1 - st * 0.6).toFixed(3)}) rotate(${(-ang).toFixed(2)}) scale(${(2 - ball.sy).toFixed(3)} ${ball.sy.toFixed(3)}) translate(${-ball.x} ${-ball.y})`);
  } else b.setAttribute("r", 0);
  trails.forEach((c, k) => {
    const h = BH[k];
    const on = ball.on && small && h && h.on && seq;
    const a = on ? clamp(speed / (U * 60)) * 0.22 * (1 - k / trails.length) : 0;
    c.setAttribute("cx", on ? h.x : 0); c.setAttribute("cy", on ? h.y : 0);
    c.setAttribute("r", a > 0.005 ? ball.r * (0.85 - 0.13 * k) : 0);
    c.setAttribute("fill", ball.color); c.setAttribute("fill-opacity", a.toFixed(3));
  });
  BH.unshift({ t, x: ball.x, y: ball.y, on: ball.on && small });
  if (BH.length > 6) BH.length = 6;

  $("#grain").style.backgroundImage = `url(${GRAIN[Math.floor(t * 24) % GRAIN.length]})`;
  $("#grain").style.backgroundPosition = `${(Math.floor(t * 24) * 73) % 256}px ${(Math.floor(t * 24) * 131) % 256}px`;
  $("#black").style.opacity = Math.max(1 - p(t, 0, 0.6), inCubic(p(t, DURATION - 1.0, DURATION)));
}

// Achatamento curto quando a bola pousa.
const squash = (t, tl) => 1 - 0.32 * Math.exp(-Math.max(0, t - tl) * 14) * (t >= tl ? 1 : 0) * Math.sin(Math.min(1, (t - tl) / 0.12) * Math.PI);

// ---- 0 Abertura -------------------------------------------------------------
function r0(t) {
  if (!show($("#s0"), T.s0)) return;
  const ws = $$("#s0-text .w"), R = M.s0r;
  const lands = ws.map((_, i) => S0.land0 + i * S0.hop);

    // a carta do meio fica na frente
    svg.appendChild($$(".card", svg)[1]);
  } else if (i === 3) {
    // as peças vêm das laterais, encaixam e preenchem
    const k = outBack(clamp((lt + 0.4) / 0.8), 1.2);
    $(".pa", svg).setAttribute("transform", `translate(${lerp(2, 9, clamp(k, 0, 1.05))} 0)`);
    $(".pb", svg).setAttribute("transform", `translate(${lerp(28, 18, clamp(k, 0, 1.05))} 0)`);
    const kf = clamp((lt - 0.45) / 0.3);
    $(".pb path", svg).setAttribute("fill", kf > 0.5 ? "#14171e" : "#f3f2ee");
  } else {
    // barras crescem uma a uma (uso), a tendência se desenha, a terceira barra
    // é ajustada para cima, e o selo de ciclo aparece no canto do painel
    const H0 = [5, 8.5, 6.5, 11];
    $$(".ubar", svg).forEach((b, j) => {
      const k = outBack(clamp((lt + 0.5 - j * 0.15) / 0.45), 1.4);
      const adj = j === 2 ? 2.5 * inOutCubic(clamp((lt - 0.55) / 0.35)) : 0;
      const h = Math.max(0, (H0[j] + adj) * k);
      b.setAttribute("height", h); b.setAttribute("y", 19.5 - h);
    });
    const tr = $(".trend", svg);
    tr.setAttribute("stroke-dasharray", 30);
    tr.setAttribute("stroke-dashoffset", 30 * (1 - inOutCubic(clamp((lt - 0.05) / 0.5))));
    const kb = outBack(clamp((lt - 0.75) / 0.4), 1.8);
    const g = $(".badge", svg);
    g.setAttribute("transform", `translate(32.5 4.5) scale(${clamp(kb, 0, 1.2)}) rotate(${(1 - clamp(kb)) * -120}) translate(-32.5 -4.5)`);
  }
}

// ---- 4 Escala ---------------------------------------------------------------
function r4(t) {
  if (!show($("#s4"), [T.s4[0] - 0.01, T.s4[1]])) return;
  const ttl = $("#s4-title");
  ttl.style.top = (V ? H * 0.13 : H * 0.12) + "px";
  words(ttl, t, S4.title, S4.wipe[0], { stagger: 0.06 });
  const n = LEVELS.length, total = n * G.bw + (n - 1) * G.bgap, left = (W - total) / 2;
  const bars = $$("#bars .bar"), lbls = $$("#bars .bar-lbl");
  const tops = [];
  const R0 = U * 1.4;
  const ksp = inOutCubic(p(t, T.s4[0] + 0.2, T.s4[0] + 0.9));     // a bola se divide e espalha
  const kwd = inOutCubic(p(t, T.s4[0] + 0.7, S4.bars + 0.2));     // cada pedaço alarga
  bars.forEach((b, i) => {
    const x = left + i * (G.bw + G.bgap);
    const kg = outBack(p(t, S4.bars + i * 0.18, S4.bars + 0.7 + i * 0.18), 1.6);
    const beat = t > S4.hop0 + 2.4 ? 1 + 0.04 * Math.sin((t - S4.hop0) * 7.5 + i * 1.3) * Math.exp(-(t - S4.hop0 - 2.4) * 0.6) : 1;
    const wdt = lerp(2 * R0, G.bw, kwd);
    const cx = lerp(W / 2, x + G.bw / 2, ksp);
    const h = Math.max(2 * R0 * (ksp > 0 ? 1 : 0), G.bh[i] * clamp(kg, 0, 1.2) * beat);
    const br = lerp(R0, U * 0.8, kwd), brb = lerp(R0, 0, kwd);
    b.style.display = ksp > 0 ? "" : "none";
    b.style.width = wdt + "px"; b.style.height = Math.max(0, h) + "px";
    b.style.borderRadius = `${br}px ${br}px ${brb}px ${brb}px`;
    b.style.transform = `translate(${cx - wdt / 2}px, ${G.base - h}px)`;
    const filled = i === n - 1 && t >= S4.hop0 + 3 * S4.hop;
    b.style.background = filled || kwd < 0.5 ? "var(--ink)" : "var(--paper)";
    tops.push([x + G.bw / 2, G.base - h]);
    const l = lbls[i];
    l.style.width = G.bw + U * 4 + "px";
    l.style.transform = `translate(${x - U * 2}px, ${G.base + U * 2}px)`;
    fade(l, t, S4.bars + 0.3 + i * 0.18, S4.wipe[0], 1);
  });
  $("#s4-note").style.top = (V ? H * 0.8 : H * 0.88) + "px";
  fade($("#s4-note"), t, S4.note, S4.wipe[1], 1.2);
  // bola sobe os degraus
  const R = U * 1.4;
  const lands = LEVELS.map((_, i) => S4.hop0 + i * S4.hop);
  const pts = tops.map(([x, y]) => [x, y - R]);
  const start = [left - U * 6, G.base - R];
  let pos, sy = 1;
  // enquanto vira degraus, a bola some; reaparece no chão antes de subir
  const vis = t < T.s4[0] + 0.25 ? 1 : outBack(p(t, lands[0] - 1.0, lands[0] - 0.6), 2);
  if (t < T.s4[0] + 0.25) pos = [W / 2, G.base - R];
  else if (t < lands[0]) pos = hop(start, pts[0], inOutCubic(p(t, lands[0] - 0.6, lands[0])), U * 6);
  else if (t < lands[n - 1]) {
    const i = Math.min(n - 2, Math.floor((t - lands[0]) / S4.hop));
    pos = hop(pts[i], pts[i + 1], p(t, lands[i], lands[i + 1]), U * 6);
    sy = squash(t, lands[i]);
  } else { pos = pts[n - 1]; sy = squash(t, lands[n - 1]); }
  const kin = p(t, T.s4[0], T.s4[0] + 0.5);
  // a última barra cresce até cobrir a tela (volta ao escuro)
  const kw = inOutCubic(p(t, S4.wipe[0], S4.wipe[1]));
  if (kw > 0) {
    const bx = left + (n - 1) * (G.bw + G.bgap), by = G.base - G.bh[n - 1];
    const wipe = $("#wipe");
    wipe.style.display = "";
    wipe.style.background = "var(--navy)";
    const l = lerp(bx, 0, kw), tp = lerp(by, 0, kw), rr = lerp(W - bx - G.bw, 0, kw), bb = lerp(H - G.base, 0, kw);
    wipe.style.clipPath = `inset(${tp}px ${rr}px ${bb}px ${l}px round ${lerp(U * 0.8, 0, kw)}px)`;
  }
  setBall(pos[0], pos[1], R * clamp(vis, 0, 1.3), sy, kw > 0.2 ? "#fff" : "#14171e");
}

// ---- 5 Sócios ---------------------------------------------------------------
function r5(t) {
  if (!show($("#s5"), [T.s5[0], T.s5[1]])) return;
  const ttl = $("#s5-title");
  ttl.style.top = (V ? H * 0.12 : H * 0.1) + "px";
  const [a, b] = $$("#s5-title > span");
  words(a, t, S5.a, S5.merge[0], { stagger: 0.07 });
  words(b, t, S5.b, S5.merge[0], { stagger: 0.07 });
  const km = inOutCubic(p(t, S5.merge[0], S5.merge[1]));
  const center = [W / 2, G.cwY];
  const R0 = U * 1.4, home = [W / 2, H * 0.55];
  $$("#portraits .pt").forEach((el, i) => {
    const tp = S5.p0 + i * S5.p;                    // pouso no lugar do retrato
    const [cx, cy] = G.pc[i];
    const kf = inOutCubic(p(t, tp - 0.6, tp));      // voo
    const kgr = outBack(p(t, tp + 0.05, tp + 0.6), 1.5);
    const fly = hop(home, [cx, cy], kf, U * 12);
    let r = lerp(R0, G.pr, clamp(kgr, 0, 1.15));
    let x = fly[0], y = fly[1];
    // no fim, os quatro voltam a ser uma bola só
    r = lerp(r, R0 * 0.9, Math.min(1, km * 1.2));
    x = lerp(x, center[0], km); y = lerp(y, center[1], km);
    const on = t >= tp - 0.6;
    el.style.display = on ? "" : "none";
    el.style.width = el.style.height = 2 * r + "px";
    el.style.transform = `translate(${x - r}px, ${y - r}px)`;
    $("div", el).style.opacity = p(t, tp + 0.2, tp + 0.55) * (1 - p(t, S5.merge[0], S5.merge[0] + 0.3));
    el.style.background = kgr < 0.4 || km > 0.6 ? "#fff" : "#1b2030";
    const l = $$("#portraits .pt-lbl")[i];
    l.style.transform = `translate(${cx}px, ${cy + G.pr + U * 2}px) translate(-50%, 0)`;
    fade(l, t, tp + 0.35, S5.merge[0] + 0.1, 1);
  });
  // a bola chega do escuro, espera no centro e se divide em quatro
  if (t < S5.p0 - 0.6) setBall(home[0], home[1], R0 * outBack(p(t, T.s5[0], T.s5[0] + 0.5), 2));
  if (km > 0.85) setBall(center[0], center[1], U * 1.3, 1);
}

// ---- 6 Compromisso ----------------------------------------------------------
function r6(t) {
  if (!show($("#s6"), [T.s6[0], T.s6[1]])) return;
  const lead = $("#s6-lead");
  lead.style.top = H * 0.2 + "px";
  words(lead, t, S6.lead, T.s6[1] - 0.2, { stagger: 0.05 });
  const ws = $$("#s6-text .w"), R = M.s6r;
  const lands = ws.map((_, i) => S6.land0 + i * S6.hop);
  const tops = M.s6.map(r => [r.cx, r.y + r.h * 0.12 - R]);
  const tEnd = lands[lands.length - 1] + 0.7;   // pouso no ponto final
  const ko = inCubic(p(t, T.s6[1] - 0.6, T.s6[1] - 0.1));
  ws.forEach((w, i) => {
    const kin = outCubic(p(t, S6.text + i * 0.06, S6.text + 0.7 + i * 0.06));
    outline(w, outCubic(p(t, lands[i] - 0.02, lands[i] + 0.3)));
    const sq = press(t, lands[i]);
    w.style.opacity = kin * (1 - ko);
    w.style.transformOrigin = "50% 85%";
    w.style.transform = `translateY(${((1 - kin) * 0.3 - ko * 0.3).toFixed(3)}em) scale(${(1 + 0.05 * sq).toFixed(3)}, ${(1 - 0.1 * sq).toFixed(3)})`;
    ripple(w, t, lands[i] + 0.05);
    const bl = (1 - kin) * 10 + ko * 8;
    w.style.filter = bl > 0.05 ? `blur(${bl.toFixed(2)}px)` : "none";
  });
  // a bola chega dos sócios, pula de palavra em palavra e vira o ponto final
  const start = [W / 2, G.cwY];
  let pos, sy = 1;
  if (t < lands[0]) pos = hop(start, tops[0], inOutCubic(p(t, T.s6[0] + 0.4, lands[0])), U * 6);
  else if (t < lands[lands.length - 1]) {
    const i = Math.min(lands.length - 2, Math.floor((t - lands[0]) / S6.hop));
    pos = hop(tops[i], tops[i + 1], p(t, lands[i], lands[i + 1]), U * 6);
    sy = squash(t, lands[i]);
  } else if (t < tEnd) {
    pos = hop(tops[tops.length - 1], M.s6dot, inOutCubic(p(t, lands[lands.length - 1], tEnd)), U * 5);
    sy = squash(t, lands[lands.length - 1]);
  } else { pos = M.s6dot; sy = squash(t, tEnd); }
  // fim da cena: a bola vai para o primeiro ponto do fecho
  const ke = inOutCubic(p(t, T.s6[1] - 0.5, T.s6[1] + 0.35));
  if (ke > 0) pos = hop(pos, [M.s7[0][0], M.s7[0][1] - M.s7[0][2] * 1.05], ke, U * 6);
  setBall(pos[0], pos[1], lerp(R, M.s7[0][2], ke), sy);
}

// ---- 7 Fecho ----------------------------------------------------------------
function r7(t) {
  if (!show($("#s7"), [T.s7[0], T.s7[1] + 1])) { $$("#fx .ghost").forEach(g => g.setAttribute("r", 0)); return; }
  const rows = $$("#s7-lines > div");
  const lands = CLOSE.map((_, i) => S7.l0 + i * S7.l + 0.2);
  rows.forEach((row, i) => {
    rise(row, t, S7.l0 + i * S7.l - 0.25, S7.out[0] + i * 0.08, 0.02);
  });
  const pts = M.s7.map(([x, y, r]) => [x, y - r * 1.05]);
  // as frases já pontuadas ficam com o ponto
  $$("#fx .ghost").forEach((g, j) => {
    const done = j < CLOSE.length && t >= lands[j] + 0.45 && t < S7.out[0] + j * 0.08;
    g.setAttribute("cx", pts[j] ? pts[j][0] : 0); g.setAttribute("cy", pts[j] ? pts[j][1] : 0);
    g.setAttribute("r", done ? M.s7[j][2] : 0);
  });
  let pos = pts[0], sy = 1, r = M.s7[0][2];
  if (t >= lands[0]) {
    const i = Math.min(CLOSE.length - 1, Math.floor((t - lands[0]) / S7.l));
    const nx = Math.min(CLOSE.length - 1, i + 1);
    pos = i === nx ? pts[i] : hop(pts[i], pts[nx], inOutCubic(p(t, lands[nx] - 0.45, lands[nx])), U * 5);
    sy = squash(t, lands[i]);
  }
  // a bola vira a marca outra vez, e o nome volta com o ponto
  const lock = $("#s7-lock");
  lock.style.top = (V ? H * 0.3 : H * 0.2) + "px";
  const mk = $(".mark", lock);
  markRing(mk, t, S7.mark);
  const mr = rectOf(mk);
  const km = outBack(p(t, S7.mark + 0.7, S7.mark + 1.4), 1.3);
  const s = mr.w / 32;
  const markPos = [mr.x + lerp(13, 19, km) * s, mr.y + lerp(19, 13, km) * s];
  const kc = inOutCubic(p(t, S7.out[0], S7.mark + 0.2));
  pos = [lerp(pos[0], markPos[0], kc), lerp(pos[1], markPos[1], kc)];
  r = lerp(r, 10 * s, outCubic(p(t, S7.mark - 0.1, S7.mark + 0.7)));
  setBall(pos[0], pos[1], r, kc > 0 ? 1 : sy);
  const kpaint = inOutCubic(p(t, S7.paint[0], S7.paint[1]));
  const Rp = Math.hypot(Math.max(markPos[0], W - markPos[0]), Math.max(markPos[1], H - markPos[1])) * 1.05;
  const clip = `circle(${Math.max(0.001, kpaint * Rp)}px at ${markPos[0]}px ${markPos[1]}px)`;
  $("#s7-paint").style.clipPath = clip; $("#s7-shade").style.clipPath = clip;
  $("#s7-paint").style.transform = `scale(${lerp(1.18, 1.03, outCubic(p(t, S7.paint[0], DURATION)))})`;
  rise($("#s7-word"), t, S7.word, undefined, 0.07);
  dropDot($("#s7-word"), t, S7.dot, 1);
  fade($("#s7-line"), t, S7.line, undefined, 1);
  const kc2 = outBack(p(t, S7.cta, S7.cta + 0.5), 1.5);
  $("#s7-cta").style.transform = `scale(${lerp(0.85, 1, clamp(kc2, 0, 1.2))})`;
  $("#s7-cta").style.opacity = clamp(kc2);
  $("#s7-cta svg").style.transform = `translateX(${Math.sin(clamp((t - S7.cta - 0.8) / 0.5) * Math.PI) * U * 0.6}px)`;
  fade($("#s7-url"), t, S7.url, undefined, 0.8);
  $$("#s7-lock > *").forEach(el => { if (el !== mk && el.id !== "s7-word") el.style.visibility = t >= S7.mark ? "visible" : "hidden"; });
  mk.style.visibility = t >= S7.mark - 0.05 ? "visible" : "hidden";
  $("#s7-word").style.visibility = t >= S7.word - 0.05 ? "visible" : "hidden";
}

// ---------------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------------
const q = new URLSearchParams(location.search);
layout(+q.get("w") || 1920, +q.get("h") || 1080);
build();
// Elementos de texto, para a auditoria de legibilidade (video/auditar-textos.mjs).
const TEXT_SELECTOR = "#s0-text, .lane-lbl, .badge, .cap, #s2-word, #s3-title, .st .word, .st .out, #s4-title, .bar-lbl, #s4-note, #s5-title > span, .pt-lbl, #s6-lead, #s6-text, #s7-lines > div, #s7-word, #s7-line, #s7-cta, #s7-url";
Object.assign(window, { DURATION, CUES, CHORDS, TEXT_SELECTOR, render });
window.ready = document.fonts.ready.then(() =>
  Promise.all(["hero-rich", ...TEAM.map(m => "team/" + m[2])].map(n => new Promise(res => {
    const im = new Image(); im.onload = im.onerror = res; im.src = `../public/images/${n}.jpg`;
  })))
).then(() => { measure(); render(0); });
if (!q.has("frame")) {
  window.ready.then(() => {
    const start = performance.now();
    const loop = now => { render(((now - start) / 1000) % DURATION); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  });
}
</script>
</body>
