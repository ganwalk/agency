<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Ritmo.: mídia kit</title>
<!--
  Fonte única das peças do mídia kit. Cada peça é aberta com ?peca=<id> e
  fotografada por build.mjs no tamanho exato da rede. Mesma linguagem do site
  e do filme: fundo navy com grade de pontos (ou papel), marca de dois
  círculos, Manrope, e o diagrama da convergência do documento de identidade.
-->
<style>
  @font-face { font-family: "Manrope"; src: url("../../../video/fonts/manrope-latin-wght-normal.woff2") format("woff2"); font-weight: 200 800;
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: "Manrope"; src: url("../../../video/fonts/manrope-latin-ext-wght-normal.woff2") format("woff2"); font-weight: 200 800;
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  :root { --navy: #0d1017; --paper: #f3f2ee; --ink: #14171e; --muted: #8f96aa; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Manrope", system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; }
  #a { position: relative; overflow: hidden; }
  .dark { background: var(--navy); color: #fff; }
  .light { background: var(--paper); color: var(--ink); }
  .grid { position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,0.08) 1.2px, transparent 1.6px); }
  .light .grid { background-image: radial-gradient(rgba(20,23,30,0.08) 1.2px, transparent 1.6px); }
  .vig { position: absolute; inset: 0; background: radial-gradient(ellipse 80% 75% at 50% 50%, transparent 55%, rgba(0,0,0,0.35) 100%); }
  .light .vig { background: radial-gradient(ellipse 80% 75% at 50% 50%, transparent 60%, rgba(0,0,0,0.06) 100%); }
  .c { position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .wm { font-weight: 800; letter-spacing: -0.035em; line-height: 1; white-space: nowrap; }
  .eb { font-weight: 700; letter-spacing: 0.28em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
  .light .eb { color: #6b6f7a; }
  .lt { font-weight: 800; letter-spacing: -0.04em; line-height: 1.04; }
  .row { display: flex; align-items: center; }
  .pill { display: inline-flex; align-items: center; background: #fff; color: var(--ink); font-weight: 800; border-radius: 999px; }
  .lbl { position: absolute; font-weight: 700; letter-spacing: 0.24em; text-transform: uppercase; white-space: nowrap; }
</style>
</head>
<body>
<div id="a"></div>
<script>
const MARK = (fg) => `<svg viewBox="0 0 32 32" width="100%" height="100%" style="overflow:visible"><circle cx="19" cy="13" r="10" fill="${fg}"/><circle cx="13" cy="19" r="10" fill="none" stroke="${fg}" stroke-width="3"/></svg>`;
const mark = (size, fg) => `<div style="width:${size}px;height:${size}px">${MARK(fg)}</div>`;
const lock = (h, fg, gap = 0.28) => `<div class="row" style="gap:${h * gap}px">${mark(h * 1.05, fg)}<div class="wm" style="font-size:${h * 1.08}px">Ritmo.</div></div>`;

// O diagrama da convergência (página 1 do documento): três entradas, o ponto, a saída.
function diagram(w, h, fg, { labels = true, out = true, fs = 14 } = {}) {
  const px = w * (out ? 0.62 : 0.86), py = h / 2, x0 = labels ? w * 0.26 : w * 0.04, dy = h * 0.33;
  const sw = Math.max(2, h * 0.012);
  const line = y => `<path d="M${x0} ${y} C ${x0 + (px - x0) * 0.55} ${y}, ${x0 + (px - x0) * 0.62} ${py}, ${px} ${py}" fill="none" stroke="${fg}" stroke-width="${sw}" stroke-linecap="round"/>`;
  const r = h * 0.07;
  let svg = `<svg width="${w}" height="${h}" style="overflow:visible;position:absolute;left:0;top:0">` + [-1, 0, 1].map(k => line(py + k * dy)).join("") +
    `<circle cx="${px}" cy="${py}" r="${r}" fill="${fg}"/>`;
  if (out) {
    const a0 = px + r * 2, a1 = w * 0.86, hd = h * 0.06;
    svg += `<path d="M${a0} ${py} H ${a1} M ${a1 - hd} ${py - hd} L ${a1} ${py} L ${a1 - hd} ${py + hd}" fill="none" stroke="${fg}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"/>`;
  }
  svg += `</svg>`;
  let html = `<div style="position:relative;width:${w}px;height:${h}px">${svg}`;
  if (labels) ["Pessoas", "Processos", "Tecnologia"].forEach((t, i) => {
    html += `<div class="lbl" style="font-size:${fs}px;right:${w - x0 + fs}px;top:${py + (i - 1) * dy}px;transform:translateY(-50%);color:${fg}">${t}</div>`;
  });
  if (out) html += `<div class="lbl" style="font-size:${fs}px;left:${w * 0.89}px;top:${py}px;transform:translateY(-50%);color:${fg}">Escolha útil</div>`;
  return html + `</div>`;
}

const PIECES = {
  // Fotos de perfil: conteúdo dentro do círculo inscrito.
  "perfil-marca-escuro": [1080, 1080, "dark", (W, H) => `<div class="c" style="inset:0">${mark(W * 0.44, "#fff")}</div>`],
  "perfil-marca-claro": [1080, 1080, "light", (W, H) => `<div class="c" style="inset:0">${mark(W * 0.44, "#14171e")}</div>`],
  "perfil-nome-escuro": [1080, 1080, "dark", (W, H) => `<div class="c" style="inset:0;gap:${W * 0.05}px">${mark(W * 0.3, "#fff")}<div class="wm" style="font-size:${W * 0.15}px">Ritmo.</div></div>`],
  "perfil-nome-claro": [1080, 1080, "light", (W, H) => `<div class="c" style="inset:0;gap:${W * 0.05}px">${mark(W * 0.3, "#14171e")}<div class="wm" style="font-size:${W * 0.15}px">Ritmo.</div></div>`],

  // Capas. LinkedIn e X: o avatar cobre o canto inferior esquerdo, então o
  // conteúdo fica à direita e no alto.
  "capa-linkedin": [1584, 396, "dark", (W, H) => cover(W, H, { left: W * 0.3, right: W * 0.05, top: H * 0.16, bottom: H * 0.16, fs: H * 0.135 })],
  "capa-x": [1500, 500, "dark", (W, H) => cover(W, H, { left: W * 0.28, right: W * 0.05, top: H * 0.16, bottom: H * 0.22, fs: H * 0.11 })],
  // Facebook: área segura no centro (o celular corta as laterais).
  "capa-facebook": [1640, 624, "dark", (W, H) => cover(W, H, { left: W * 0.12, right: W * 0.12, top: H * 0.2, bottom: H * 0.2, fs: H * 0.1 })],
  // YouTube: tudo dentro da área segura de 1546x423 no centro.
  "capa-youtube": [2560, 1440, "dark", (W, H) => cover(W, H, { left: (W - 1546) / 2 + 30, right: (W - 1546) / 2 + 30, top: (H - 423) / 2 + 10, bottom: (H - 423) / 2 + 10, fs: 72 })],

  // Instagram
  "instagram-post": [1080, 1350, "dark", (W, H) => `
    <div style="position:absolute;left:${W * 0.09}px;top:${H * 0.09}px" class="eb" >${"Consultoria tecnológica"}</div>
    <div class="lt" style="position:absolute;left:${W * 0.09}px;right:${W * 0.09}px;top:${H * 0.2}px;font-size:${W * 0.125}px">Cada empresa tem uma cadência.</div>
    <div style="position:absolute;left:${W * 0.09}px;top:${H * 0.62}px">${diagram(W * 0.66, H * 0.2, "#fff", { fs: 22 })}</div>
    <div style="position:absolute;left:${W * 0.09}px;bottom:${H * 0.08}px">${lock(W * 0.06, "#fff")}</div>`],
  "instagram-story": [1080, 1920, "dark", (W, H) => `
    <div class="c" style="left:0;right:0;top:${H * 0.2}px;gap:${W * 0.05}px">${mark(W * 0.28, "#fff")}<div class="wm" style="font-size:${W * 0.17}px">Ritmo.</div><div class="eb" style="font-size:${W * 0.026}px">Consultoria tecnológica</div></div>
    <div class="lt" style="position:absolute;left:${W * 0.1}px;right:${W * 0.1}px;top:${H * 0.56}px;text-align:center;font-size:${W * 0.075}px">Tecnologia que faz sentido na prática.</div>
    <div class="c" style="left:0;right:0;bottom:${H * 0.12}px;gap:${W * 0.03}px"><div class="pill" style="font-size:${W * 0.042}px;padding:${W * 0.03}px ${W * 0.07}px">Fale conosco</div><div style="font-size:${W * 0.045}px;font-weight:700">+55 62 9850-6450</div></div>`],
  "destaque-ritmo": [1080, 1920, "dark", (W, H) => `<div class="c" style="inset:0">${mark(W * 0.36, "#fff")}</div>`],
  "destaque-metodo": [1080, 1920, "dark", (W, H) => `<div class="c" style="inset:0">${iconMetodo(W * 0.5)}</div>`],
  "destaque-contato": [1080, 1920, "dark", (W, H) => `<div class="c" style="inset:0">${iconContato(W * 0.42)}</div>`],
};

function cover(W, H, { left, right, top, bottom, fs }) {
  const iw = W - left - right, ih = H - top - bottom;
  const dw = iw * 0.46, dh = ih * 0.62;
  return `<div style="position:absolute;left:${left}px;top:${top}px;width:${iw}px;height:${ih}px;display:flex;align-items:center;justify-content:space-between;gap:${iw * 0.04}px">
      <div style="display:flex;flex-direction:column;gap:${fs * 0.55}px">
        ${lock(fs * 0.62, "#fff")}
        <div class="lt" style="font-size:${fs}px;max-width:${iw * 0.5}px">Tecnologia que faz sentido na prática.</div>
      </div>
      <div style="flex:none">${diagram(dw, dh, "#fff", { fs: Math.max(12, fs * 0.2) })}</div>
    </div>`;
}
function iconMetodo(s) {
  return `<svg width="${s}" height="${s}" viewBox="0 0 40 40" style="overflow:visible"><path d="M4 26 C 12 26, 12 14, 20 14 S 28 26, 36 26" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    <circle cx="4" cy="26" r="2.6" fill="#fff"/><circle cx="20" cy="14" r="2.6" fill="#0d1017" stroke="#fff" stroke-width="2"/><circle cx="36" cy="26" r="4.2" fill="#fff"/></svg>`;
}
function iconContato(s) {
  return `<svg width="${s}" height="${s}" viewBox="0 0 40 40" style="overflow:visible"><path d="M6 8 H34 A3 3 0 0 1 37 11 V25 A3 3 0 0 1 34 28 H16 L9 34 V28 H6 A3 3 0 0 1 3 25 V11 A3 3 0 0 1 6 8 Z" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="13" cy="18" r="2" fill="#fff"/><circle cx="20" cy="18" r="2" fill="#fff"/><circle cx="27" cy="18" r="2.8" fill="#fff"/></svg>`;
}

const id = new URLSearchParams(location.search).get("peca") || "capa-linkedin";
const [W, H, theme, fn] = PIECES[id];
const a = document.getElementById("a");
a.className = theme; a.style.width = W + "px"; a.style.height = H + "px";
const gap = Math.round(Math.min(W, H) / 34);
a.innerHTML = `<div class="grid" style="background-size:${gap}px ${gap}px"></div><div class="vig"></div>` + fn(W, H);
window.PIECE = { W, H };
window.LIST = Object.keys(PIECES).map(k => [k, PIECES[k][0], PIECES[k][1]]);
window.ready = document.fonts.ready;
</script>
</body>
</html>
